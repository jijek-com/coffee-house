<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Sign up</title><meta name="viewport" content="width=device-width,minimum-scale=1"/><meta name="description" content="Coffee House - Enjoy premium coffee at our charming cafe"/><link rel="icon" href="./favicon.ico"><script defer="defer" src="./header.bundle.js"></script><script defer="defer" src="./footer.bundle.js"></script><script defer="defer" src="./signup.bundle.js"></script><script defer="defer" src="./theme.bundle.js"></script></head><body><div class="wrapper"><header-component data-page="signup"></header-component><main><div class="signup__section signup"><div class="container signup__container"><div class="signup__box-fixed"><h2 class="signup__h2">Registration</h2><form class="signup__form" id="signupForm"><div class="signup__row"><div class="signup__col"><label for="name">Login</label> <input id="name" name="name" placeholder="placeholder" class="signup__input" required/> <small class="error-message"></small></div><div class="signup__col"><label for="passwd">Password</label> <input id="passwd" name="passwd" placeholder="placeholder" class="signup__input" required/> <small class="error-message"></small></div><div class="signup__col"><label for="confirmPasswd">Confirm Password</label> <input id="confirmPasswd" name="confirmPasswd" placeholder="placeholder" class="signup__input" required/> <small class="error-message"></small></div></div><div class="signup__row"><div class="signup__col"><label for="city">City</label> <select id="city" class="signup__input" name="city" required><option disabled="disabled" selected="selected" hidden value="">Select city</option><option value="london">London</option><option value="paris">Paris</option><option value="berlin">Berlin</option></select> <small class="error-message"></small></div><div class="signup__col"><label for="street">Street</label> <select id="street" class="signup__input" name="street" required><option value="" disabled="disabled" selected="selected" hidden>Select street</option></select> <small class="error-message"></small></div><div class="signup__col"><label for="houseNumber">House number</label> <input type="number" id="houseNumber" class="signup__input" name="houseNumber" required/> <small class="error-message"></small></div><div class="signup__col"><span>Pay by</span><div class="signup__switch"><div class="switch__box"><input type="radio" id="payByCash" name="paymentMethod" class="signup__checkbox" value="Cash" checked="checked" required/> <span class="signup__checkbox-style"></span> <label for="payByCash">Cash</label></div><div class="switch__box"><input type="radio" id="payByCard" name="paymentMethod" class="signup__checkbox" value="Card"/> <span class="signup__checkbox-style"></span> <label for="payByCard">Card</label></div></div><small class="error-message"></small></div></div><button class="signup__btn fs-medium" id="registerBtn">Registration</button><div id="globalError" class="error-message"></div></form></div></div></div></main><footer-component></footer-component><button id="theme-toggle">🌙 / ☀️</button></div></body></html>
