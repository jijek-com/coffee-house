<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in</title>

    <meta name="viewport" content="width=device-width,minimum-scale=1" />
    <meta name="description" content="Coffee House - Enjoy premium coffee at our charming cafe" />
  </head>
  <body>
    <div class="wrapper">
      <header-component data-page="signin"></header-component>

      <main>
        <div class="signin__section signin">
          <div class="container signin__container">
            <div class="signin__box-fixed">
              <h2 class="signin__h2">Sign In</h2>

              <div class="signin__form">
                <div class="signin__col">
                  <label for="login" class="signin__label fs-medium">Login</label>
                  <input type="text" id="login" placeholder="Placeholder" class="signin__input" />
                  <span class="signin__error"></span>
                </div>

                <div class="signin__col">
                  <label for="password" class="signin__label fs-medium">Password</label>
                  <input
                    type="text"
                    id="password"
                    placeholder="Placeholder"
                    class="signin__input"
                  />
                  <span class="signin__error"></span>
                </div>

                <button class="signin__btn fs-medium">Sign In</button>

                <p class="signin__error-global"></p>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer-component></footer-component>
      <button id="theme-toggle">🌙 / ☀️</button>
    </div>
  </body>
</html>
